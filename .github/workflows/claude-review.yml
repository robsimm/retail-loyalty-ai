name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Claude Code Review
        uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          review_prompt: |
            Review this pull request for the retail-loyalty-ai project.

            Check against the patterns in CLAUDE.md:
            1. TDD compliance: were tests written before implementation?
            2. Pydantic v2 models used for all domain objects
            3. Business logic in pure functions (not buried in classes)
            4. No API keys or secrets in code
            5. Exception handling is specific (no bare except Exception)
            6. Follows project naming conventions
            7. No over-abstraction for single-use code
            8. mypy strict typing compliance

            Post inline comments on specific lines where issues are found.
            Summarise findings and either approve or request changes.
